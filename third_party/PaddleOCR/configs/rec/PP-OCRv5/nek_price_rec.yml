Global:
  model_name: nek_price_rec_v1
  debug: false
  use_gpu: false
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: C:/wamp64/www/price-ocr-paddle/output/nek_price_rec_v1
  save_epoch_step: 5
  eval_batch_step: [0, 50]
  cal_metric_during_train: true
  pretrained_model: C:/wamp64/www/price-ocr-paddle/third_party/PaddleOCR/pretrained_models/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: C:/wamp64/www/price-ocr-paddle/datasets/price_rec_nek_train/images/nek_001_row_01.png
  character_dict_path: ./ppocr/utils/dict/ppocrv5_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: C:/wamp64/www/price-ocr-paddle/output/nek_price_rec_v1/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: C:/wamp64/www/price-ocr-paddle/datasets/price_rec_nek_train
    label_file_list:
      - C:/wamp64/www/price-ocr-paddle/datasets/price_rec_nek_train/train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: false
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: C:/wamp64/www/price-ocr-paddle/datasets/price_rec_nek_train
    label_file_list:
      - C:/wamp64/www/price-ocr-paddle/datasets/price_rec_nek_train/test.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 16
    num_workers: 0